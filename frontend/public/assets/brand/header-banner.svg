    <stop offset="1" stop-color="#0B2D23"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.15" cy="0.25" r="0.6">
    <stop offset="0" stop-color="#79C08B" stop-opacity="0.20"/>
    <stop offset="1" stop-color="#79C08B" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="1920" height="400" fill="url(#bg)"/>
<rect width="1920" height="400" fill="url(#glow)"/>


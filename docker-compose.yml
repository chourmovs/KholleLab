services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-khollelab}
      POSTGRES_USER: ${POSTGRES_USER:-khollelab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-khollelab-dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  inference:
    image: ghcr.io/ggml-org/llama.cpp:server-b5350
    environment:
      LLAMA_CACHE: /models/cache
      HF_TOKEN: ${HF_TOKEN:-}
    expose:
      - "8080"
    volumes:
      - llm_models:/models
    command: ["-hf", "${LOCAL_LLM_HF_REPO:-Qwen/Qwen3-4B-GGUF}:${LOCAL_LLM_QUANT:-Q4_K_M}", "--host", "0.0.0.0", "--port", "8080", "-c", "${LOCAL_LLM_CONTEXT_SIZE:-8192}", "-t", "${LOCAL_LLM_THREADS:-6}", "-b", "${LOCAL_LLM_BATCH_SIZE:-512}", "-np", "${LOCAL_LLM_PARALLEL:-1}"]
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://khollelab:khollelab-dev@postgres:5432/khollelab}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      PROBLEMS_DIR: /problems
      LLM_PROVIDER: ${LLM_PROVIDER:-local}
      LLM_MODEL: ${LLM_MODEL:-gpt-5-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-90}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-http://inference:8080/v1}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-Qwen/Qwen3-4B-GGUF}
      LOCAL_LLM_HF_REPO: ${LOCAL_LLM_HF_REPO:-Qwen/Qwen3-4B-GGUF}
      LOCAL_LLM_QUANT: ${LOCAL_LLM_QUANT:-Q4_K_M}
      LOCAL_LLM_CONTEXT_SIZE: ${LOCAL_LLM_CONTEXT_SIZE:-8192}
      LOCAL_LLM_THREADS: ${LOCAL_LLM_THREADS:-6}
      LOCAL_LLM_BATCH_SIZE: ${LOCAL_LLM_BATCH_SIZE:-512}
      LOCAL_LLM_PARALLEL: ${LOCAL_LLM_PARALLEL:-1}
      LOCAL_LLM_TIMEOUT_SECONDS: ${LOCAL_LLM_TIMEOUT_SECONDS:-90}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8000}
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Use the Node runtime already present in the image rather than relying on
      # Alpine's optional wget applet. 127.0.0.1 also avoids localhost/IPv6
      # resolution differences between Docker runner environments.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  llm_models:

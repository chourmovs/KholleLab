services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-khollelab}
      POSTGRES_USER: ${POSTGRES_USER:-khollelab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-khollelab-dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://khollelab:khollelab-dev@postgres:5432/khollelab}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      PROBLEMS_DIR: /problems
      LLM_PROVIDER: ${LLM_PROVIDER:-huggingface}
      LLM_MODEL: ${LLM_MODEL:-gpt-5-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-90}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_ROUTER_BASE_URL: ${HF_ROUTER_BASE_URL:-https://router.huggingface.co/v1}
      LLM_MODEL_FAMILY: ${LLM_MODEL_FAMILY:-qwen}
      HF_QWEN_FAST_MODEL: ${HF_QWEN_FAST_MODEL:-Qwen/Qwen3-8B:nscale}
      HF_QWEN_DEEP_MODEL: ${HF_QWEN_DEEP_MODEL:-Qwen/Qwen3-32B:nscale}
      HF_GEMMA_FAST_MODEL: ${HF_GEMMA_FAST_MODEL:-google/gemma-3-12b-it:deepinfra}
      HF_GEMMA_DEEP_MODEL: ${HF_GEMMA_DEEP_MODEL:-google/gemma-3-27b-it:deepinfra}
      HF_TIMEOUT_SECONDS: ${HF_TIMEOUT_SECONDS:-60}
      HF_FAST_MAX_TOKENS: ${HF_FAST_MAX_TOKENS:-192}
      HF_EXAMINER_AUDIT_MAX_TOKENS: ${HF_EXAMINER_AUDIT_MAX_TOKENS:-1024}
      HF_EXAMINER_ADJUDICATION_MAX_TOKENS: ${HF_EXAMINER_ADJUDICATION_MAX_TOKENS:-1536}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_ROTATION: ${LOG_ROTATION:-10 MB}
      LOG_RETENTION: ${LOG_RETENTION:-7 days}
      DIAGNOSTICS_ENABLED: ${DIAGNOSTICS_ENABLED:-false}
      DIAGNOSTICS_TOKEN: ${DIAGNOSTICS_TOKEN:-}
    expose:
      - "8000"
    volumes:
      - runtime_logs:/runtime-logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  evaluation-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # The backend is the sole migration owner. Waiting for its health avoids
    # two containers racing Alembic against the same PostgreSQL schema.
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://khollelab:khollelab-dev@postgres:5432/khollelab}
      PROBLEMS_DIR: /problems
      LLM_PROVIDER: ${LLM_PROVIDER:-huggingface}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_ROUTER_BASE_URL: ${HF_ROUTER_BASE_URL:-https://router.huggingface.co/v1}
      LLM_MODEL_FAMILY: ${LLM_MODEL_FAMILY:-qwen}
      HF_QWEN_FAST_MODEL: ${HF_QWEN_FAST_MODEL:-Qwen/Qwen3-8B:nscale}
      HF_QWEN_DEEP_MODEL: ${HF_QWEN_DEEP_MODEL:-Qwen/Qwen3-32B:nscale}
      HF_GEMMA_FAST_MODEL: ${HF_GEMMA_FAST_MODEL:-google/gemma-3-12b-it:deepinfra}
      HF_GEMMA_DEEP_MODEL: ${HF_GEMMA_DEEP_MODEL:-google/gemma-3-27b-it:deepinfra}
      HF_TIMEOUT_SECONDS: ${HF_TIMEOUT_SECONDS:-60}
      HF_FAST_MAX_TOKENS: ${HF_FAST_MAX_TOKENS:-192}
      HF_EXAMINER_AUDIT_MAX_TOKENS: ${HF_EXAMINER_AUDIT_MAX_TOKENS:-1024}
      HF_EXAMINER_ADJUDICATION_MAX_TOKENS: ${HF_EXAMINER_ADJUDICATION_MAX_TOKENS:-1536}
      EVALUATION_WORKER_POLL_SECONDS: ${EVALUATION_WORKER_POLL_SECONDS:-1}
      EVALUATION_STALE_SECONDS: ${EVALUATION_STALE_SECONDS:-180}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - runtime_logs:/runtime-logs
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8000}
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Use the Node runtime already present in the image rather than relying on
      # Alpine's optional wget applet. 127.0.0.1 also avoids localhost/IPv6
      # resolution differences between Docker runner environments.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  runtime_logs:

  title: Démontrer une propriété par récurrence
  statement: Variante 1 — Démontrer par récurrence que, pour tout $n\geq0$, $\sum_{k=0}^n 8k=8n(n+1)/2$.
  curriculum:
    level: terminale
    difficulty: 3
    expectations:
    - lycee-2019-tle-induction
  topics:
  - algebra
  skills:

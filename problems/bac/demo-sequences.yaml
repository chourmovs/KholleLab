statement: |
  Soit \(u_0=0\) et \(u_{n+1}=\sqrt{2+u_n}\). Étudier sa convergence.
reference_solution: |
  Par récurrence, \(0\leq u_n\leq2\) et la suite est croissante. Sa limite positive vérifie \(l=\sqrt{2+l}\), donc \(l=2\).
hints:
  - level: 1
    text: |
      Cherche un majorant stable par la récurrence.

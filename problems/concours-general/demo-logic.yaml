statement: |
  Cent interrupteurs sont éteints. Au passage \(k\), on inverse ceux dont le numéro est multiple de \(k\). Lesquels restent allumés après cent passages ?
reference_solution: |
  Un interrupteur est inversé autant de fois que son numéro possède de diviseurs. Seuls les carrés parfaits en ont un nombre impair.
hints:
  - level: 1
    text: |
      Quand un entier a-t-il un nombre impair de diviseurs ?

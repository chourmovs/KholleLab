name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend
        run: python -m pip install -e './backend[dev]'
      - name: Compile
        run: python -m compileall -q backend/app
      - name: Ruff
        run: ruff check backend
      - name: Pytest
        run: pytest -q backend/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        run: corepack enable && corepack install --global pnpm@10.34.5
      - name: Install frontend
        working-directory: frontend
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        working-directory: frontend
        run: pnpm run typecheck
      - name: Unit tests
        working-directory: frontend
        run: pnpm run test -- --run
      - name: Production build
        working-directory: frontend
        run: pnpm run build

  compose-smoke:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      POSTGRES_PASSWORD: ci-smoke-password
      KHOLLELAB_PORT: '8080'
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config >/dev/null
      - name: Start stack
        run: docker compose up -d --build
      - name: Smoke test
        run: ./scripts/smoke.sh
      - name: Diagnostics
        if: failure()
        run: docker compose ps && docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down -v

name: CI
on: [push, pull_request]
jobs:
  backend:
    env:
      LLM_PROVIDER: fake
      DIAGNOSTICS_ENABLED: "false"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: pip install -r backend/requirements.txt
      - run: cd backend && pytest -q
      - run: python scripts/validate_problems.py
      - run: python scripts/validate_resources.py
      - run: python scripts/report_resource_coverage.py
      - run: cd backend && python -m compileall app
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: cd frontend && npm ci
      - run: cd frontend && npm run lint
      - run: cd frontend && npm test
      - run: cd frontend && npm run build
      - run: cd frontend && npx playwright install --with-deps chromium
      - run: cd frontend && npm run test:e2e
  integration:
    env:
      LLM_PROVIDER: fake
      DIAGNOSTICS_ENABLED: "false"
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose up -d --wait
      - name: Assert container and image health metadata
        run: |
          docker compose ps
          for service in postgres backend frontend evaluation-worker; do
            container="$(docker compose ps -q "$service")"
            test -n "$container"
            test "$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$container")" = "healthy"
          done
          for service in backend frontend; do
            image="$(docker inspect -f '{{.Image}}' "$(docker compose ps -q "$service")")"
            test "$(docker image inspect -f '{{if .Config.Healthcheck}}configured{{end}}' "$image")" = "configured"
          done
          worker_test="$(docker inspect -f '{{json .Config.Healthcheck.Test}}' "$(docker compose ps -q evaluation-worker)")"
          echo "$worker_test" | grep -q 'app.worker_healthcheck'
      - name: Assert runtime logging ownership and isolation
        run: |
          test "$(docker compose exec -T backend id -u)" != "0"
          test "$(docker compose exec -T evaluation-worker id -u)" != "0"
          docker compose exec -T backend sh -c 'test -w /runtime-logs && test -f /runtime-logs/khollelab.log && test -f /runtime-logs/inference.log'
          docker compose exec -T evaluation-worker sh -c 'test -w /runtime-logs && test -f /runtime-logs/worker.log && test -f /runtime-logs/worker-inference.log'
          ! docker compose logs backend evaluation-worker | grep -E 'Runtime file logging unavailable|PermissionError'
      # The Compose stack intentionally publishes no host ports. Run the smoke
      # client inside the Compose network, where the `frontend` DNS name exists.
      - run: docker compose exec -T backend python - < scripts/smoke.py
      - if: always()
        run: docker compose logs && docker compose down -v
